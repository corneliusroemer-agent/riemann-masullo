name: PR schedule

# Dispatches `PR check` with a concurrency cap and per-file serialization (#6787, Step 3).
#
# Keeping active PR checks capped (e.g. 28 out of ~40 ubuntu-latest slots) leaves headroom for
# Main state, Auto-merge, and CI/import PRs. Serializing active checks by touched library file
# avoids parallel checks on busy files invalidating each other as soon as the first merges.
#
# Runs main's scripts only; never checks out, builds, or interpolates anything from a PR.
# Has no contents:write or pull-requests:write permissions.

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows: ["PR check"]
    types: [completed]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pr-schedule
  cancel-in-progress: false

jobs:
  schedule:
    if: github.repository == 'mccorvie/riemann-masullo'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: write       # dispatch PR check runs
      statuses: write      # sync PR check commit status
    steps:
      - name: Check out main's scheduler scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: scripts/ci
      - name: Schedule PR checks
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MAX_CONCURRENT_CHECKS: "28"
        run: python3 scripts/ci/pr_schedule.py
