name: Lean Action CI

# For pull requests that touch build configuration, root Lean targets, vendored Lean code,
# Lean scripts, or the checks this workflow runs. `PR check` builds library-only pull requests,
# `CI self-test` checks workflow and Python/shell CI changes, and `Main state` builds main;
# running a cold full build on docs, claims, or other workflow/script edits only burns runners.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'lakefile.toml'
      - 'lakefile.lean'
      - 'lean-toolchain'
      - 'lake-manifest.json'
      - '*.lean'
      - 'RiemannMasullo/External/**/*.lean'
      - 'scripts/**/*.lean'
      - 'scripts/lint.sh'
      - 'scripts/signatures.sh'
      - '.github/workflows/lean_action_ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-action-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: scripts/lint.sh
      - uses: leanprover/lean-action@v1
      - name: No sorry inside definitions
        run: scripts/signatures.sh --sorry-in-defs
